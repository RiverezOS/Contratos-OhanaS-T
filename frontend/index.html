<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Contratos | Ohana Snacks & Troles</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color-scheme: dark;
        }

        body {
            background: radial-gradient(circle at top, #1c1c22 0%, #0a0a0d 100%);
            color: #f5f5f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        .container {
            background: #141418;
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75), 0 0 20px rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.28);
            text-align: center;
        }

        .header {
            margin-bottom: 22px;
        }

        .logo {
            width: 85px;
            height: auto;
            margin-bottom: 12px;
            border-radius: 50%;
            border: 2px solid rgba(212, 175, 55, 0.45);
            padding: 3px;
            background: #0d0d10;
        }

        .brand-subtitle {
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #d4af37;
            font-weight: 700;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #c5a880;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: #0d0d11;
            border: 1.5px solid #2e2b24;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #d4af37;
            background: #08080a;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }

        input::placeholder {
            color: #55524b;
        }

        /* Icono de calendario dorado */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8) sepia(100%) saturate(400%) hue-rotate(5deg);
            cursor: pointer;
            opacity: 0.9;
            padding: 2px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Resumen de saldo */
        .balance-card {
            background: rgba(212, 175, 55, 0.08);
            border: 1px dashed rgba(212, 175, 55, 0.35);
            border-radius: 10px;
            padding: 12px 14px;
            margin: 18px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .balance-label {
            color: #a89f91;
        }

        .balance-amount {
            color: #ffd700;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        /* Botón de acción dorado */
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa820a 100%);
            border: none;
            border-radius: 10px;
            color: #121214;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 18px rgba(212, 175, 55, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(212, 175, 55, 0.5);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Enlace de respaldo por si el navegador bloquea la pestaña */
        .calendar-fallback {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: #191920;
            border: 1px solid #d4af37;
            border-radius: 10px;
            text-align: center;
        }

        .calendar-fallback a {
            color: #ffd700;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 11px;
            color: #706a5e;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="assets/logo.png" alt="Ohana Snacks & Troles" class="logo">
            <div class="brand-subtitle">Ohana Snacks & Troles</div>
            <h1>Generador de Contratos</h1>
        </div>

        <form id="contractForm" onsubmit="event.preventDefault(); generarContrato();">
            <div class="form-group">
                <label for="nombre">Nombre del cliente</label>
                <input type="text" id="nombre" placeholder="Nombre completo" required>
            </div>

            <div class="form-group">
                <label for="servicio">Servicio / Paquete</label>
                <input type="text" id="servicio" placeholder="Ej. 70 snacks (10 vasos personalizados)" required>
            </div>

            <div class="form-group">
                <label for="fechaEvento">Fecha del evento</label>
                <input type="date" id="fechaEvento" onclick="this.showPicker()" required>
            </div>

            <div class="form-group">
                <label for="lugarEvento">Lugar y hora del evento</label>
                <input type="text" id="lugarEvento" placeholder="Ej. Salón Kids Zone 10:50 am" required>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="precio">Precio total (\$)</label>
                    <input type="number" id="precio" placeholder="2800" min="0" step="any" oninput="calcularSaldo()" required>
                </div>
                <div class="form-group">
                    <label for="anticipo">Anticipo (\$)</label>
                    <input type="number" id="anticipo" placeholder="1000" min="0" step="any" oninput="calcularSaldo()" required>
                </div>
            </div>

            <div class="balance-card">
                <span class="balance-label">Pendiente por liquidar:</span>
                <span class="balance-amount" id="saldoText">\$0.00 MXN</span>
            </div>

            <button type="submit" id="btnGenerar">Generar contrato</button>
        </form>

        <div class="calendar-fallback" id="calendarFallback">
            <a id="calendarLinkDirect" target="_blank" rel="noopener noreferrer">
                📅 Si no se abrió solo, toca aquí para abrir Google Calendar
            </a>
        </div>

        <div class="footer">Sistema automático de contratos</div>
    </div>

    <script>
        function calcularSaldo() {
            const precio = parseFloat(document.getElementById("precio").value) || 0;
            const anticipo = parseFloat(document.getElementById("anticipo").value) || 0;
            const saldo = Math.max(0, precio - anticipo);
            document.getElementById("saldoText").textContent = "\$" + saldo.toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " MXN";
            return saldo;
        }

        function construirUrlGoogleCalendar(nombre, servicio, fecha, lugar, precio, anticipo, saldo) {
            const cleanFecha = fecha.replace(/-/g, "");
            let horaInicio = "120000";
            let horaFin = "150000";

            // Si el usuario escribe la hora en el texto (ej. 10:50 am)
            const matchHora = lugar.match(/(\d{1,2}):(\d{2})\s*(am|pm)?/i);
            if (matchHora) {
                let h = parseInt(matchHora[1], 10);
                const m = matchHora[2];
                const ampm = matchHora[3] ? matchHora[3].toLowerCase() : null;
                if (ampm === "pm" && h < 12) h += 12;
                if (ampm === "am" && h === 12) h = 0;
                const startH = String(h).padStart(2, "0");
                const endH = String((h + 3) % 24).padStart(2, "0"); // 3 horas de evento
                horaInicio = `${startH}${m}00`;
                horaFin = `${endH}${m}00`;
            }

            const startDateTime = `${cleanFecha}T${horaInicio}`;
            const endDateTime = `${cleanFecha}T${horaFin}`;

            const titulo = `Ohana: ${servicio} - ${nombre}`;
            const descripcion = `CONTRATO OHANA SNACKS & TROLES\n\n` +
                                `• Cliente: ${nombre}\n` +
                                `• Servicio: ${servicio}\n` +
                                `• Lugar: ${lugar}\n` +
                                `• Total: $${precio} MXN\n` +
                                `• Anticipo: $${anticipo} MXN\n` +
                                `• Saldo pendiente: $${saldo.toLocaleString("es-MX", { minimumFractionDigits: 2 })} MXN`;

            const baseUrl = "https://calendar.google.com/calendar/render?action=TEMPLATE";
            return `${baseUrl}&text=${encodeURIComponent(titulo)}&dates=${startDateTime}/${endDateTime}&location=${encodeURIComponent(lugar)}&details=${encodeURIComponent(descripcion)}`;
        }

        async function generarContrato() {
            const btn = document.getElementById("btnGenerar");
            const fallbackBox = document.getElementById("calendarFallback");
            const fallbackLink = document.getElementById("calendarLinkDirect");

            const nombre = document.getElementById("nombre").value.trim();
            const servicio = document.getElementById("servicio").value.trim();
            const fechaEvento = document.getElementById("fechaEvento").value;
            const lugarEvento = document.getElementById("lugarEvento").value.trim();
            const precio = document.getElementById("precio").value.trim();
            const anticipo = document.getElementById("anticipo").value.trim();

            if (!nombre || !servicio || !fechaEvento || !lugarEvento || !precio || !anticipo) {
                alert("Por favor, completa todos los campos.");
                return;
            }

            const saldo = calcularSaldo();
            const calendarUrl = construirUrlGoogleCalendar(nombre, servicio, fechaEvento, lugarEvento, precio, anticipo, saldo);

            // Abrimos la pestaña INMEDIATAMENTE al hacer clic para que Chrome no la bloquee
            const calendarTab = window.open("about:blank", "_blank");

            btn.disabled = true;
            btn.textContent = "Generando contrato...";
            fallbackBox.style.display = "none";

            try {
                const response = await fetch("/generate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nombre,
                        servicio,
                        fechaEvento,
                        lugarEvento,
                        precio,
                        anticipo
                    })
                });

                if (!response.ok) {
                    throw new Error("Error al generar el contrato");
                }

                // Descargar el PDF
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;

                const nombreLimpio = nombre.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "_");
                a.download = `Contrato_${nombreLimpio}.pdf`;

                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);

                // Redirigir la pestaña que ya abrimos directo a Google Calendar
                if (calendarTab) {
                    calendarTab.location.href = calendarUrl;
                } else {
                    fallbackLink.href = calendarUrl;
                    fallbackBox.style.display = "block";
                }

            } catch (err) {
                console.error(err);
                if (calendarTab) calendarTab.close();
                alert("Hubo un error al generar el contrato. Revisa la conexión o el servidor.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Generar contrato";
            }
        }
    </script>
</body>
</html>
