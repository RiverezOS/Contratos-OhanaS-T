<body>

<div class="container">
  <h1>📄 Generador de Contratos</h1>

  <input type="text" id="nombre" placeholder="Nombre del cliente">
  <input type="text" id="servicio" placeholder="Servicio">
  <input type="date" id="fechaEvento" placeholder="Fecha del evento">
  <input type="text" id="lugarEvento" placeholder="Lugar del evento">
  <input type="number" id="precio" placeholder="Precio">
  <input id="anticipo" placeholder="Anticipo (MXN)" />

<button onclick="generarContrato()">Generar contrato</button>

  <div class="footer">
    Sistema automático de contratos
  </div>
</div>

<script>
async function generarContrato() {

  console.log("CLICK funcionando");

  const nombre = document.getElementById("nombre").value;
  const servicio = document.getElementById("servicio").value;
  const fechaEvento = document.getElementById("fechaEvento").value;
  const lugarEvento = document.getElementById("lugarEvento").value;
  const precio = document.getElementById("precio").value;
  const anticipo = document.getElementById("anticipo").value;

  console.log({ nombre, servicio, fechaEvento, lugarEvento, precio, anticipo });

  if (!nombre || !servicio || !fechaEvento || !lugarEvento || !precio || !anticipo) {
    alert("Completa todos los campos");
    return;
  }

const response = await fetch("http://localhost:3000/generate", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    nombre,
    servicio,
    fechaEvento,
    lugarEvento,
    precio,
    anticipo
  })
});

if (!response.ok) {
  alert("Error al generar el contrato");
  return;
}

const blob = await response.blob();
const url = window.URL.createObjectURL(blob);

const a = document.createElement("a");
a.href = url;

const nombreArchivo = "Contrato_" + nombre.replace(/\s+/g, "_") + ".pdf";

a.download = nombreArchivo;

document.body.appendChild(a);
a.click();
a.remove();
}
</script>
